<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Normal iframe — Embed chat</title>
</head>
<body>
  <!-- Add this agent to your website — Normal iframe (Agents → API) -->
  <iframe src="https://ppn-rag-console-fe-dev-431311422997.asia-southeast2.run.app/embed/agents/7f6cf1d7-f9a4-4e47-9ae2-44b38208d4f4" width="100%" height="600" title="Agent chat" allow="clipboard-write"></iframe>

  <!-- iframe needs embed token from your server, handed over like widget.js (rag:token) -->
  <script>
    const frame = document.querySelector('iframe[src*="/embed/agents/"]');
    if (!frame) {
      throw new Error("Iframe embed DigiFusion tidak ditemukan.");
    }
    const embedOrigin = new URL(frame.src, window.location.href).origin;

    async function sendEmbedToken() {
      const res = await fetch("/chat-token");
      if (!res.ok) {
        const detail = await res.text();
        if (window.location.protocol === "file:") {
          throw new Error(
            "Buka lewat serve_chatfusion.py (http://localhost:8080/DigiFusion/ChatFusion1.html), bukan file://"
          );
        }
        throw new Error(detail);
      }
      const { embed_token } = await res.json();
      frame.contentWindow?.postMessage(
        { type: "rag:token", token: embed_token },
        embedOrigin
      );
    }

    frame.addEventListener("load", () => {
      void sendEmbedToken().catch(console.error);
    });

    window.addEventListener("message", (event) => {
      if (event.origin !== embedOrigin || event.source !== frame.contentWindow) return;
      if (event.data?.type === "rag:token-request") {
        void sendEmbedToken().catch(console.error);
      }
    });
  </script>
</body>
</html>
